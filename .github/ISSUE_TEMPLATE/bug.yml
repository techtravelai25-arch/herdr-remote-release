name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: App, Android, Linux, Herdr and agent versions. Remove private paths and credentials.
    validations:
      required: true
